<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- rounded app tile -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#0d1117"/>

  <!-- mac browser window (empty tab) -->
  <g>
    <!-- window body -->
    <rect x="14" y="20" width="100" height="88" rx="11" fill="#161b22" stroke="#454d57" stroke-width="3.5"/>
    <!-- title bar -->
    <path d="M14 31 a11 11 0 0 1 11-11 h78 a11 11 0 0 1 11 11 v11 H14 Z" fill="#242b33"/>
    <line x1="14" y1="42" x2="114" y2="42" stroke="#454d57" stroke-width="3.5"/>
    <!-- traffic lights -->
    <circle cx="27.5" cy="31" r="4.5" fill="#ff5f57"/>
    <circle cx="41.5" cy="31" r="4.5" fill="#febc2e"/>
    <circle cx="55.5" cy="31" r="4.5" fill="#28c840"/>
  </g>

  <!-- slide-preview arrows, lower left (manim-slides prev/next controls) -->
  <g>
    <!-- prev (hollow) -->
    <path d="M46 76 L28 90 L46 104 Z" fill="none" stroke="#69b4ff" stroke-width="5.5" stroke-linejoin="round"/>
    <!-- next (filled) -->
    <path d="M55 73 L79 90 L55 107 Z" fill="#69b4ff"/>
  </g>
</svg>
